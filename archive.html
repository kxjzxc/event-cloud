26-07-18-chainhaha","title":"chainhaha","date":"2026-07-18","hasValidDate":true,"contentHtml":"<p>因为加班，所以晚上想去livehouse除除班味。在为数不多的没有售罄的演出中，看到了chainhaha。我一开始并没有决定好要不要去，直到我听了她的《圣火》，开头两个“娒”，让我意识到这个音乐人的歌中有温州的色彩。于是在前往公司的地铁上我购买了她今晚的演出。</p>\n<img class=\"ec-img\" src=\"../assets/thumbnails/2026-07-18-22-23-02.webp\" data-preview=\"../assets/previews/2026-07-18-22-23-02.webp\" alt=\"2026-07-18-22-23-02.jpeg\" loading=\"lazy\">\n\n<p>可能是我看过的live偏少，第一次见到在台下观众围绕中演出，配上她歌曲中祭祀感，沉浸感十足。只是在圈外的观众实在难以看到演出者，未免有些气馁。好在第一首歌结束后她便回到了舞台。</p>\n<img class=\"ec-img\" src=\"../assets/thumbnails/2026-07-18-22-23-30.webp\" data-preview=\"../assets/previews/2026-07-18-22-23-30.webp\" alt=\"2026-07-18-22-23-30.jpeg\" loading=\"lazy\">\n\n<p>不得不说，她的舞台设计着实不错，用有限的设备通过镜子和灯光展现出梦幻神秘的氛围，她的服装也是圣洁又异质，会让我联想到《丝之歌》里的角色。</p>\n<img class=\"ec-img\" src=\"../assets/thumbnails/2026-07-18-22-23-42.webp\" data-preview=\"../assets/previews/2026-07-18-22-23-42.webp\" alt=\"2026-07-18-22-23-42.jpeg\" loading=\"lazy\">\n\n<p>她的音乐我认为还是挺不错的，其中几首也有爵士的味道在里头，比较戳中我。不过让我惊讶的还是这位30.7岁的女士依旧给人一种纯真的感觉，与她的美学风格形成极大的反差，就像是那种会很兴奋分享自己感受的孩子。</p>\n<img class=\"ec-img\" src=\"../assets/thumbnails/2026-07-18-22-23-50.webp\" data-preview=\"../assets/previews/2026-07-18-22-23-50.webp\" alt=\"2026-07-18-22-23-50.jpeg\" loading=\"lazy\">\n\n<p>在演出接近尾声时，我忽然涌起一种悲伤的感觉。不知为何，主唱和她的演出让我体会到一个人要经历数不清的苦痛才能成为现在的自己，回首望去尽是伤痕累累，但最终依旧成为闪耀的自身。</p>\n","contentRaw":"因为加班，所以晚上想去livehouse除除班味。在为数不多的没有售罄的演出中，看到了chainhaha。我一开始并没有决定好要不要去，直到我听了她的《圣火》，开头两个“娒”，让我意识到这个音乐人的歌中有温州的色彩。于是在前往公司的地铁上我购买了她今晚的演出。\n\n![2026-07-18-22-23-02.jpeg](../assets/2026-07-18-22-23-02.jpeg)\n\n可能是我看过的live偏少，第一次见到在台下观众围绕中演出，配上她歌曲中祭祀感，沉浸感十足。只是在圈外的观众实在难以看到演出者，未免有些气馁。好在第一首歌结束后她便回到了舞台。\n\n![2026-07-18-22-23-30.jpeg](../assets/2026-07-18-22-23-30.jpeg)\n\n不得不说，她的舞台设计着实不错，用有限的设备通过镜子和灯光展现出梦幻神秘的氛围，她的服装也是圣洁又异质，会让我联想到《丝之歌》里的角色。\n\n![2026-07-18-22-23-42.jpeg](../assets/2026-07-18-22-23-42.jpeg)\n\n她的音乐我认为还是挺不错的，其中几首也有爵士的味道在里头，比较戳中我。不过让我惊讶的还是这位30.7岁的女士依旧给人一种纯真的感觉，与她的美学风格形成极大的反差，就像是那种会很兴奋分享自己感受的孩子。\n\n![2026-07-18-22-23-50.jpeg](../assets/2026-07-18-22-23-50.jpeg)\n\n在演出接近尾声时，我忽然涌起一种悲伤的感觉。不知为何，主唱和她的演出让我体会到一个人要经历数不清的苦痛才能成为现在的自己，回首望去尽是伤痕累累，但最终依旧成为闪耀的自身。","tags":[],"links":[],"media":[{"originalPath":"/home/runner/work/event-cloud/event-cloud/graph/assets/2026-07-18-22-23-02.jpeg","type":"image","alt":"2026-07-18-22-23-02.jpeg","thumbnailPath":"assets/thumbnails/2026-07-18-22-23-02.webp","previewPath":"assets/previews/2026-07-18-22-23-02.webp"},{"originalPath":"/home/runner/work/event-cloud/event-cloud/graph/assets/2026-07-18-22-23-30.jpeg","type":"image","alt":"2026-07-18-22-23-30.jpeg","thumbnailPath":"assets/thumbnails/2026-07-18-22-23-30.webp","previewPath":"assets/previews/2026-07-18-22-23-30.webp"},{"originalPath":"/home/runner/work/event-cloud/event-cloud/graph/assets/2026-07-18-22-23-42.jpeg","type":"image","alt":"2026-07-18-22-23-42.jpeg","thumbnailPath":"assets/thumbnails/2026-07-18-22-23-42.webp","previewPath":"assets/previews/2026-07-18-22-23-42.webp"},{"originalPath":"/home/runner/work/event-cloud/event-cloud/graph/assets/2026-07-18-22-23-50.jpeg","type":"image","alt":"2026-07-18-22-23-50.jpeg","thumbnailPath":"assets/thumbnails/2026-07-18-22-23-50.webp","previewPath":"assets/previews/2026-07-18-22-23-50.webp"}],"tracks":[],"hidden":false,"sourceFile":"pages/chainhaha.md","siblingIds":["2026-07-18-2026718-加班时间","2026-07-18-longing-for-the-rain","2026-07-18-凤头海雀的奇妙表情"],"backlinkIds":[],"relatedIds":[]},{"id":"2026-08-07-痴迷","title":"《痴迷》","date":"2026-08-07","hasValidDate":true,"contentHtml":"<p><img class=\"ec-img\" src=\"../assets/thumbnails/2026-08-15-19-18-58.webp\" data-preview=\"../assets/previews/2026-08-15-19-18-58.webp\" alt=\"2026-08-15-19-18-58.jpeg\" loading=\"lazy\"> <img class=\"ec-img\" src=\"../assets/thumbnails/2026-08-15-19-19-18.webp\" data-preview=\"../assets/previews/2026-08-15-19-19-18.webp\" alt=\"2026-08-15-19-19-18.jpeg\" loading=\"lazy\"> <img class=\"ec-img\" src=\"../assets/thumbnails/2026-08-15-19-19-35.webp\" data-preview=\"../ass previews/2026-07-27-09-07-32.webp"}],"tracks":[],"hidden":false,"sourceFile":"pages/东北烧烤聚餐.md","siblingIds":["2026-07-24-20260724-午餐","2026-07-24-光遇-致梵高","2026-07-24-第二只鸊鷉游于河中"],"backlinkIds":[],"relatedIds":[]},{"id":"2026-07-27-东野圭吾的离开","title":"东野圭吾的离开","date":"2026-07-27","hasValidDate":true,"contentHtml":"<p>东野圭吾的书我其实看得不多，《白夜行》《嫌疑人X的献身》《解忧杂货铺》，或许还有《幻夜》，因此虽然这个消息让我吃惊，但也不至于难受到无心工作。<br>但我依旧短暂了失去了一些工作的动力，因为我感觉随着年岁增长，旧世界在不断离我而去，曾经构筑我认知世界的名人：袁隆平、吴孟达、坂本龙一、张雪峰……都在已离世，这让我有些悲伤，人类精神永远要适应时间流转，我不是从一开始就是能活几十岁的生物，而是在成长过程中逐渐适应漫长的人生</p>\n<img class=\"ec-img\" src=\"../assets/thumbnails/2026-08-01-11-29-31.webp\" data-preview=\"../assets/previews/2026-08-01-11-29-31.webp\" alt=\"2026-08-01-11-29-31.jpeg\" loading=\"lazy\">","contentRaw":"东野圭吾的书我其实看得不多，《白夜行》《嫌疑人X的献身》《解忧杂货铺》，或许还有《幻夜》，因此虽然这个消息让我吃惊，但也不至于难受到无心工作。\n但我依旧短暂了失去了一些工作的动力，因为我感觉随着年岁增长，旧世界在不断离我而去，曾经构筑我认知世界的名人：袁隆平、吴孟达、坂本龙一、张雪峰……都在已离世，这让我有些悲伤，人类精神永远要适应时间流转，我不是从一开始就是能活几十岁的生物，而是在成长过程中逐渐适应漫长的人生\n\n![2026-08-01-11-29-31.jpeg](../assets/2026-08-01-11-29-31.jpeg)","tags":[],"links":[],"media":[{"originalPath":"/home/runner/work/event-cloud/event-cloud/graph/assets/2026-08-01-11-29-31.jpeg","type":"image","alt":"2026-08-01-11-29-31.jpeg","thumbnailPath":"assets/thumbnails/2026-08-01-11-29-31.webp","previewPath":"assets/previews/2026-08-01-11-29-31.webp"}],"tracks":[],"hidden":false,"sourceFile":"pages/东野圭吾的离开.md","siblingIds":["2026-07-27-miss-right","2026-07-27-the-coats-of-claude","2026-07-27-明月高悬于腾讯之上"],"backlinkIds":[],"relatedIds":[]},{"id":"2026-07-22-乌云笼罩魔都","title":"乌云笼罩魔都","date":"2026-07-22","hasValidDate":true,"contentHtml":"<p>吃完麦当劳，望见天边一条明暗分明的分割线，浓厚诡谲的乌云笼罩在魔都上空，如同黑死徒卷土重来，要唤来一场巨大的风暴。</p>\n<p><img class=\"ec-img\" src=\"../assets/thumbnails/2026-07-23-10-20-06.webp\" data-preview=\"../assets/previews/2026-07-23-10-20-06.webp\" alt=\"2026-07-23-10-20-06.jpeg\" loading=\"lazy\"> <img class=\"ec-img\" src=\"../assets/thumbnails/2026-07-23-10-20-13.webp\" data-preview=\"../assets/previews/2026-07-23-10-20-13.webp\" alt=\"2026-07 2026-07-22-14-05-44.webp"},{"originalPath":"/home/runner/work/event-cloud/event-cloud/graph/assets/2026-07-22-14-28-22.jpeg","type":"image","alt":"2026-07-22-14-28-22.jpeg","thumbnailPath":"assets/thumbnails/2026-07-22-14-28-22.webp","previewPath":"assets/previews/2026-07-22-14-28-22.webp"}],"tracks":[],"hidden":false,"sourceFile":"pages/在盛夏死去的蝉.md","siblingIds":["2026-07-22-乌云笼罩魔都","2026-07-22-移轴模式下的十字路口"],"backlinkIds":[],"relatedIds":[]},{"id":"2025-07-26-坪山美术馆","title":"坪山美术馆","date":"2025-07-26","hasValidDate":true,"contentHtml":"<p>朋友来深圳坪山打工，遂挑了一个周末去坪山聚一聚。<br>午饭吃的萨莉亚，后面想想还是有些不到位，尽管朋友没吃过萨莉亚，但朋友刚到深圳的第一次聚会我请吃这个还是小家子气了一点。<br>午饭结束后就坐着他的电瓶车来到坪山最中心的一块区域，刚好路过美术馆就顺便进去逛了逛，毕竟天气太热，有空调的室内还是令人心旷神怡的。<br>坪山的美术馆大多是装置艺术，我是不太懂，但还是逛得饶有趣味。尤其是一些古旧的装置，像是电视机，会给人一种梦核的感觉。</p>\n<p><img class=\"ec-img\" src=\"../assets/thumbnails/2026-07-26-18-40-18.webp\" data-preview=\"../assets/previews/2026-07-26-18-40-18.webp\" alt=\"2026-07-26-18-40-18.jpeg\" loading=\"lazy\"> <img class=\"ec-img\" src=\"../assets/thumbnails/2026-07-26-18-40-37.webp\" data-preview=\"../assets/previews/2026-07-26-18-40-37.webp\" alt=\"2026-07-26-18-40-37.jpeg\" loading=\"lazy\"> <img class=\"ec-img\" src=\"../assets/thumbnails/2026-07-26-18-52-18.webp\" data-preview=\"../assets/previews/2026-07-26-18-52-18.webp\" alt=\"2026-07-26-18-52-18.jpeg\" loading=\"lazy\">  <img class=\"ec-img\" src=\"../assets/thumbnails/2026-07-26-18-41-11.webp\" data-preview=\"../assets/previews/2026-07-26-18-41-11.webp\" alt=\"2026-07-26-18-41-11.jpeg\" loading=\"lazy\"></p>\n","contentRaw":"朋友来深圳坪山打工，遂挑了一个周末去坪山聚一聚。\n午饭吃的萨莉亚，后面想想还是有些不到位，尽管朋友没吃过萨莉亚，但朋友刚到深圳的第一次聚会我请吃这个还是小家子气了一点。\n午饭结束后就坐着他的电瓶车来到坪山最中心的一块区域，刚好路过美术馆就顺便进去逛了逛，毕竟天气太热，有空调的室内还是令人心旷神怡的。\n坪山的美术馆大多是装置艺术，我是不太懂，但还是逛得饶有趣味。尤其是一些古旧的装置，像是电视机，会给人一种梦核的感觉。\n\n![2026-07-26-18-40-18.jpeg](../assets/2026-07-26-18-40-18.jpeg) ![2026-07-26-18-40-37.jpeg](../assets/2026-07-26-18-40-37.jpeg) ![2026-07-26-18-52-18.jpeg](../assets/2026-07-26-18-52-18.jpeg)  ![2026-07-26-18-41-11.jpeg](../assets/2026-07-26-18-41-11.jpeg)","tags":[],"links":[],"media":[{"originalPath":"/home/runner/work/event-cloud/event-cloud/graph/assets/2026-07-26-18-40-18.jpeg","type":"image","alt":"2026-07-26-18-40-18.jpeg","thumbnailPath":"assets/thumbnails/2026-07-26-18-40-18.webp","previewPath":"assets/previews/2026-07-26-18-40-18.webp"},{"originalPath":"/home/runner/work/event-cloud/event-cloud/graph/assets/2026-07-26-18-40-37.jpeg","type":"image","alt":"2026-07-26-18-40-37.jpeg","thumbnailPath":"assets/thumbnails/2026-07-26-18-40-37.webp","previewPath":"assets/previews/2026-07-26-18-40-37.webp"},{"originalPath":"/home/runner/work/event-cloud/event-cloud/graph/assets/2026-07-26-18-52-18.jpeg","type":"image","alt":"2026-07-26-18-52-18.jpeg","thumbnailPath":"assets/thumbnails/2026-07-26-18-52-18.webp","previewPath":"assets/previews/2026-07-26-18-52-18.webp"},{"originalPath":"/home/runner/work/event-cloud/event-cloud/graph/assets/2026-07-26-18-41-11.jpeg","type":"image","alt":"2026-07-26-18-41-11.jpeg","thumbnailPath":"assets/thumbnails/2026-07-26-18-41-11.webp","previewPath":"assets/previews/2026-07-26-18-41-11.webp"}],"tracks":[],"hidden":false,"sourceFile":"pages/坪山美术馆.md","siblingIds":[],"backlinkIds":[],"relatedIds":[]},{"id":"2026-07-09-埃迪卡拉纪的海岸","title":"埃迪卡拉纪的海岸","date":"2026-07-09","hasValidDate":true,"contentHtml":"<p>下午摸鱼，一边开会，一边向GPT有关地质年代的知识，进行一场赛博远古之旅。从最早的冥古宙炼狱一般的岩浆海，跨越几十亿年的时光，来到安静而又充满活力的埃迪卡拉级的海岸，终于感受到了一种度假的感觉。用GPT的话来讲就是“它既保留了远古地球的陌生感，又已经拥有丰富而独特的生命景观，是整个前寒武纪最值得旅游的目的地。”<br>埃迪卡拉生物们给人一种很松弛的感觉，与世无争地躺在海底，在食物充足的环境中躺平了几千万年。那时大家都很友好，没有内卷，也没有焦虑，所有人都有光明的未来。<br>我很想在这样的海岸边待上一下午，听着海浪拍打岩石，看着这些缓慢呼吸，静静生长的前辈们，什么也不想，和它们一样，纯粹地感受这个世界。<br>或许可以让某个角色拥有将他人传送到埃迪卡拉纪海岸地能力，逐渐同化成一株随波摇摆的查尼迪盘，放弃万恶之源的智慧，获得永恒的平静。</p>\n<img class=\"ec-img\" src=\"../assets/thumbnails/2026-07-17-22-02-47.webp\" data-preview=\"../assets/previews/2026-07-17-22-02-47.webp\" alt=\"2026-07-17-22-02-47.jpeg\" loading=\"lazy\">","contentRaw":"下午摸鱼，一边开会，一边向GPT有关地质年代的知识，进行一场赛博远古之旅。从最早的冥古宙炼狱一般的岩浆海，跨越几十亿年的时光，来到安静而又充满活力的埃迪卡拉级的海岸，终于感受到了一种度假的感觉。 古典感觉都是耳熟能详）。我对旋律虽然印象深刻，但从没意识到这是一首从头到尾的渐强，更没想到一首曲子用不同的乐器去演奏一段重复的旋律。基于新的知识去细听，就发现这个曲子听起来趣味十足，持续不断且渐强的军鼓，从solo到合奏的各色乐器，让这个重复循环的旋律充满活力与乐趣。\n\n<iframe style=\"border-radius:12px\" src=\"https://open.spotify.com/embed/track/6YlLdymeZi8FTNe3WCNULA?utm_source=generator\" width=\"100%\" height=\"352\" frameBorder=\"0\" allowfullscreen=\"\" allow=\"autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture\" loading=\"lazy\"></iframe>","tags":[],"links":[],"media":[],"tracks":[{"platform":"spotify","id":"6YlLdymeZi8FTNe3WCNULA","title":"Boléro, M. 81","embedUrl":"https://open.spotify.com/embed/track/6YlLdymeZi8FTNe3WCNULA?utm_source=generator","coverUrl":"https://image-cdn-fa.spotifycdn.com/image/ab67616d00001e02e2b685c0b1adc77eab9b1f24","artist":"Maurice Ravel / Leonard Bernstein / New York Philharmonic","durationMs":859373}],"hidden":false,"sourceFile":"pages/波莱罗舞曲.md","siblingIds":["2026-07-13-20260713-咖啡时间","2026-07-13-栏杆上的奇妙贴纸"],"backlinkIds":[],"relatedIds":[]},{"id":"2026-07-20-爆甲的腾讯大楼","title":"爆甲的腾讯大楼","date":"2026-07-20","hasValidDate":true,"contentHtml":"<p>腾讯大楼的呼吸灯亮起来的时候，感觉像是披着古代铠甲的将军，灯光越发明亮，越像是要爆甲提高战斗力。</p>\n<img class=\"ec-img\" src=\"../assets/thumbnails/2026-07-23-10-29-53.webp\" data-preview=\"../assets/previews/2026-07-23-10-29-53.webp\" alt=\"2026-07-23-10-29-53.jpeg\" loading=\"lazy\">","contentRaw":"腾讯大楼的呼吸灯亮起来的时候，感觉像是披着古代铠甲的将军，灯光越发明亮，越像是要爆甲提高战斗力。\n\n![2026-07-23-10-29-53.jpeg](../assets/2026-07-23-10-29-53.jpeg)","tags":[],"links":[],"media":[{"originalPath":"/home/runner/work/event-cloud/event-cloud/graph/assets/2026-07-23-10-29-53.jpeg","type":"image","alt":"2026-07-23-10-29-53.jpeg","thumbnailPath":"assets/thumbnails/2026-07-23-10-29-53.webp","previewPath":"assets/previews/2026-07-23-10-29-53.webp"}],"tracks":[],"hidden":false,"sourceFile":"pages/爆甲的腾讯大楼.md","siblingIds":["2026-07-20-20260720-咖啡时间与云","2026-07-20-关于创新的梦"],"backlinkIds":[],"relatedIds":[]},{"id":"2026-07-28-玩动物井玩到深夜","title":"玩动物井玩到深夜","date":"2026-07-28","hasValidDate": itle":"装死的皮蠹","date":"2026-07-23","hasValidDate":true,"contentHtml":"<p>在香薰蜡烛上发现这个小虫子一动不动，以为是死去的尸体。我把它移到桌上用显微镜模式拍了几张，豆包查了一下发现是皮蠹，看到说明中有一条“受惊后会装死不动”，疑心它不会是还活着，但看着半天没有动静也没管它。谁知不一会，就发现它在桌上乱爬，遂用自动铅笔将其从窗户甩出去。</p>\n<p><img class=\"ec-img\" src=\"../assets/thumbnails/2026-07-23-10-24-03.webp\" data-preview=\"../assets/previews/2026-07-23-10-24-03.webp\" alt=\"2026-07-23-10-24-03.jpeg\" loading=\"lazy\"> <img class=\"ec-img\" src=\"../assets/thumbnails/2026-07-23-10-24-10.webp\" data-preview=\"../assets/previews/2026-07-23-10-24-10.webp\" alt=\"2026-07-23-10-24-10.jpeg\" loading=\"lazy\"></p>\n","contentRaw":"在香薰蜡烛上发现这个小虫子一动不动，以为是死去的尸体。我把它移到桌上用显微镜模式拍了几张，豆包查了一下发现是皮蠹，看到说明中有一条“受惊后会装死不动”，疑心它不会是还活着，但看着半天没有动静也没管它。谁知不一会，就发现它在桌上乱爬，遂用自动铅笔将其从窗户甩出去。\n\n![2026-07-23-10-24-03.jpeg](../assets/2026-07-23-10-24-03.jpeg) ![2026-07-23-10-24-10.jpeg](../assets/2026-07-23-10-24-10.jpeg)","tags":[],"links":[],"media":[{"originalPath":"/home/runner/work/event-cloud/event-cloud/graph/assets/2026-07-23-10-24-03.jpeg","type":"image","alt":"2026-07-23-10-24-03.jpeg","thumbnailPath":"assets/thumbnails/2026-07-23-10-24-03.webp","previewPath":"assets/previews/2026-07-23-10-24-03.webp"},{"originalPath":"/home/runner/work/event-cloud/event-cloud/graph/assets/2026-07-23-10-24-10.jpeg","type":"image","alt":"2026-07-23-10-24-10.jpeg","thumbnailPath":"assets/thumbnails/2026-07-23-10-24-10.webp","previewPath":"assets/previews/2026-07-23-10-24-10.webp"}],"tracks":[],"hidden":false,"sourceFile":"pages/装死的皮蠹.md","siblingIds":["2026-07-23-20260723-午餐","2026-07-23-晚饭时间的天空","2026-07-23-盛夏枯萎的玫瑰"],"backlinkIds":[],"relatedIds":[]},{"id":"2026-07-17-西岸露天电影节之-汪汪梦里人","title":"西岸露天电影节之《汪汪梦里人》","date":"2026-07-17","hasValidDate":true,"contentHtml":"<p><button type=\"button\" class=\"ec-music-play\" data-track-index=\"0\"></button></p>\n<img class=\"ec-img\" src=\"../assets/thumbnails/2026-07-17-18-58-35.webp\" data-preview=\"../assets/previews/2026-07-17-18-58-35.webp\" alt=\"2026-07-17-18-58-35.jpeg\" loading=\"lazy\">\n\n<p>上海真的是一座爵士氛围很好的城市，每次电影放映前的表演都是爵士偏多。下午还刷到凤巢新开的食集也有一场爵士路演。<br>这次我只能坐在场外欣赏，在高温中听这场爵士演出。今这最后的《September》还是爵士改编版，有一段非常不错的即兴solo。<br>今天的云确实好看，但天气实在是太热，汗水止不住得流淌，没有夜风驱散暑气。音乐会结束的时候身后有一弯新月高悬，在蓝调时刻的天空中格外柔和。<br>电影依旧在七点半开始放映，我决心在小狗与机器人第一次跳舞时离开，逃离这高温，回到寒冷的工位去。</p>\n<img class=\"ec-img\" src=\"../assets/thumbnails/2026-07-17-18-59-01.webp\" data-preview=\"../assets/previews/2026-07-17-18-59-01.webp\" alt=\"2026-07-17-18-59-01.jpeg\" loading=\"lazy\">\n<img class=\"ec-img\" src=\"../assets/thumbnails/2026-07-17-18-59-14.webp\" data-preview=\"../assets/previews/2026-07-17-18-59-14.webp\" alt=\"2026-07-17-18-59-14.jpeg\" loading=\"lazy\"> <img class=\"ec-img\" src=\"../assets/thumbnails/2026-07-17-18-59-24.webp\" data-preview=\"../assets/previews/2026-07-17-18-59-24.webp\" alt=\"2026-07-17-18-59-24.jpeg\" loading=\"lazy\"> <img class=\"ec-img\" src=\"../assets/thumbnails/2026-07-17-18-59-40.webp\" data-preview=\"../assets/previews/2026-07-17-18-59-40.webp\" alt=\"两只沉思的夜师傅\" loading=\"lazy\">\n\n<img class=\"ec-img\" src=\"../assets/thumbnails/2026-07-17-19-00-16.webp\" data-preview=\"../assets/previews/2026-07-17-19-00-16.webp\" alt=\"2026-07-17-19-00-16.jpeg\" loading=\"lazy\">\n\n<img class=\"ec-img\" src=\"../assets/thumbnails/2026-07-17-20-22-35.webp\" data-preview=\"../assets/previews/2026-07-17-20-22-35.webp\" alt=\"2026-07-17-20-22-35.jpeg\" loading=\"lazy\">\n\n<img class=\"ec-img\" src=\"../assets/thumbnails/2026-07-17-20-22-15.webp\" data-preview=\"../assets/previews/2026-07-17-20-22-15.webp\" alt=\"2026-07-17-20-22-15.jpeg\" loading=\"lazy\">","contentRaw":"<iframe frameborder=\"no\" border=\"0\" marginwidth=\"0\" marginheight=\"0\" width=330 height=86 src=\"//music.163.com/outchain/player?type=2&id=481765805&auto=1&height=66\"></iframe>\n\n![2026-07-17-18-58-35.jpeg](../assets/2026-07-17-18-58-35.jpeg)\n\n上海真的是一座爵士氛围很好的城市，每次电影放映前的表演都是爵士偏多。下午还刷到凤巢新开的食集也有一场爵士路演。\n这次我只能坐在场外欣赏，在高温中听这场爵士演出。今这最后的《September》还是爵士改编版，有一段非常不错的即兴solo。\n今天的云确实好看，但天气实在是太热，汗水止不住得流淌，没有夜风驱散暑气。音乐会结束的时 -08-06-傍晚明亮的云","2026-08-06-公司楼下的树开花"],"backlinkIds":[],"relatedIds":[]},{"id":"2026-08-11-达洛维夫人","title":"达洛维夫人","date":"2026-08-11","hasValidDate":true,"contentHtml":"<p>在地铁上读了三个多月终于是读完了<br>本书视角切换得很快，所以容易读得混乱，常常会在思考现在的这个“她/他”指的是谁。<br>此书的语言在追踪意识的流动，表达上倚重隐喻，同时文字间也流淌着强烈的主体性，我很喜欢这样的语言，像是在读一篇诗歌，总有一些段落能让人感同身受，多读几次更是会有新的感悟<br>此书另一方面也在佐证，无论在哪个时代，人们思考的事物总有共通之处。</p>\n<img class=\"ec-img\" src=\"../assets/thumbnails/2026-08-15-18-46-22.webp\" data-preview=\"../assets/previews/2026-08-15-18-46-22.webp\" alt=\"2026-08-15-18-46-22.jpeg\" loading=\"lazy\">","contentRaw":"在地铁上读了三个多月终于是读完了\n本书视角切换得很快，所以容易读得混乱，常常会在思考现在的这个“她/他”指的是谁。\n此书的语言在追踪意识的流动，表达上倚重隐喻，同时文字间也流淌着强烈的主体性，我很喜欢这样的语言，像是在读一篇诗歌，总有一些段落能让人感同身受，多读几次更是会有新的感悟\n此书另一方面也在佐证，无论在哪个时代，人们思考的事物总有共通之处。\n\n![2026-08-15-18-46-22.jpeg](../assets/2026-08-15-18-46-22.jpeg)","tags":[],"links":[],"media":[{"originalPath":"/home/runner/work/event-cloud/event-cloud/graph/assets/2026-08-15-18-46-22.jpeg","type":"image","alt":"2026-08-15-18-46-22.jpeg","thumbnailPath":"assets/thumbnails/2026-08-15-18-46-22.webp","previewPath":"assets/previews/2026-08-15-18-46-22.webp"}],"tracks":[],"hidden":false,"sourceFile":"pages/达洛维夫人.md","siblingIds":["2026-08-11-我在越南是属猫"],"backlinkIds":[],"relatedIds":[]},{"id":"2026-08-05-过乐喜的糯米饭","title":"过乐喜的糯米饭","date":"2026-08-05","hasValidDate":true,"contentHtml":"<p>看着挺正宗，但第一勺伴着油条碎和肉末糯米饭一入口，我就感觉不是记忆中的那个味，口味有些偏甜偏淡，鱼饼的醋更是偏甜，虽然不难吃，但也不正宗。</p>\n<img class=\"ec-img\" src=\"../assets/thumbnails/2026-08-06-16-27-41.webp\" data-preview=\"../assets/previews/2026-08-06-16-27-41.webp\" alt=\"2026-08-06-16-27-41.jpeg\" loading=\"lazy\">","contentRaw":"看着挺正宗，但第一勺伴着油条碎和肉末糯米饭一入口，我就感觉不是记忆中的那个味，口味有些偏甜偏淡，鱼饼的醋更是偏甜，虽然不难吃，但也不正宗。\n\n![2026-08-06-16-27-41.jpeg](../assets/2026-08-06-16-27-41.jpeg)","tags":[],"links":[],"media":[{"originalPath":"/home/runner/work/event-cloud/event-cloud/graph/assets/2026-08-06-16-27-41.jpeg","type":"image","alt":"2026-08-06-16-27-41.jpeg","thumbnailPath":"assets/thumbnails/2026-08-06-16-27-41.webp","previewPa 子有印象，没想到竟然是温州的牌子。我爸说得也对，一个温州在上海买温州的牌子，也是有点奇怪。</p>\n","contentRaw":"中年男人的选择还是偏少，驾驭不了亮色，只能选择黑色和蓝色，而Polo衫以外的衣服也不太接受，希望不要太年轻的风格。\nUR是直接被排除了，但是UR的风格好适合我，以后我考虑去这家买几件。优衣库我爸也试了试，没有心仪的衣服。阿迪达斯倒是有一件纯棉的白色网球POLO衫，一问价格899元，就算我同意我爸也不同意，以后可以考虑看看有没有打折，当礼物送他了。\n最后选了森马的一件99元蓝黑色POLO衫。我其实也是最近因为荷兰弟的新闻才对这个牌子有印象，没想到竟然是温州的牌子。我爸说得也对，一个温州在上海买温州的牌子，也是有点奇怪。","tags":[],"links":[],"media":[],"tracks":[],"hidden":false,"sourceFile":"pages/陪父亲买衣服.md","siblingIds":[],"backlinkIds":[],"relatedIds":[]},{"id":"2026-07-21-雨夜的十字路口","title":"雨夜的十字路口","date":"2026-07-21","hasValidDate":true,"contentHtml":"<p>发现realme的手机相机竟然有移轴模式，于是随手拍了几张照片，确实有小人国的感觉。</p>\n<p><button type=\"button\" class=\"ec-music-play\" data-track-index=\"0\"></button></p>\n<p><img class=\"ec-img\" src=\"../assets/thumbnails/2026-07-22-10-06-40.webp\" data-preview=\"../assets/previews/2026-07-22-10-06-40.webp\" alt=\"2026-07-22-10-06-40.jpeg\" loading=\"lazy\"> <img class=\"ec-img\" src=\"../assets/thumbnails/2026-07-22-10-06-53.webp\" data-preview=\"../assets/previews/2026-07-22-10-06-53.webp\" alt=\"2026-07-22-10-06-53.jpeg\" loading=\"lazy\"></p>\n","contentRaw":"发现realme的手机相机竟然有移轴模式，于是随手拍了几张照片，确实有小人国的感觉。\n\n<button type=\"button\" class=\"ec-music-play\" data-track-index=\"0\"></button>\n\n<iframe frameborder=\"no\" border=\"0\" marginwidth=\"0\" marginheight=\"0\" width=330 height=86 src=\"//music.163.com/outchain/player?type=2&id=22764867&auto=0&height=66\"></iframe>\n\n![2026-07-22-10-06-40.jpeg](../assets/2026-07-22-10-06-40.jpeg) ![2026-07-22-10-06-53.jpeg](../assets/2026-07-22-10-06-53.jpeg)","tags":[],"links":[],"media":[{"originalPath":"/home/runner/work/event-cloud/event-cloud/graph/assets/2026-07-22-10-06-40.jpeg","type":"image","alt":"2026-07-22-10-06-40.jpeg","thumbnailPath":"assets/thumbnails/2026-07-22-10-06-40.webp","previewPath":"assets/previews/2026-07-22-10-06-40.webp"},{"originalPath":"/home/runner/work/event-cloud/event-cloud/graph/assets/2026-07-22-10-06-53.jpeg","type":"image","alt":"2026-07-22-10-06-53.jpeg","t
