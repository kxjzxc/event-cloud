6.jpeg)\n\n下班准备去育音堂，发现乌云压城，远处暴雨倾泻，但愿这暑气能随暴雨释放掉。\n\n![2026-07-18-19-04-38.jpeg](../assets/2026-07-18-19-04-38.jpeg)","tags":[],"links":[],"media":[{"originalPath":"/home/runner/work/event-cloud/event-cloud/graph/assets/2026-07-18-19-02-53.jpeg","type":"image","alt":"2026-07-18-19-02-53.jpeg","thumbnailPath":"assets/thumbnails/2026-07-18-19-02-53.webp","previewPath":"assets/previews/2026-07-18-19-02-53.webp"},{"originalPath":"/home/runner/work/event-cloud/event-cloud/graph/assets/2026-07-18-19-02-59.jpeg","type":"image","alt":"2026-07-18-19-02-59.jpeg","thumbnailPath":"assets/thumbnails/2026-07-18-19-02-59.webp","previewPath":"assets/previews/2026-07-18-19-02-59.webp"},{"originalPath":"/home/runner/work/event-cloud/event-cloud/graph/assets/2026-07-18-19-03-11.jpeg","type":"image","alt":"2026-07-18-19-03-11.jpeg","thumbnailPath":"assets/thumbnails/2026-07-18-19-03-11.webp","previewPath":"assets/previews/2026-07-18-19-03-11.webp"},{"originalPath":"/home/runner/work/event-cloud/event-cloud/graph/assets/2026-07-18-19-03-16.jpeg","type":"image","alt":"2026-07-18-19-03-16.jpeg","thumbnailPath":"assets/thumbnails/2026-07-18-19-03-16.webp","previewPath":"assets/previews/2026-07-18-19-03-16.webp"},{"originalPath":"/home/runner/work/event-cloud/event-cloud/graph/assets/2026-07-18-19-04-38.jpeg","type":"image","alt":"2026-07-18-19-04-38.jpeg","thumbnailPath":"assets/thumbnails/2026-07-18-19-04-38.webp","previewPath":"assets/previews/2026-07-18-19-04-38.webp"}],"tracks":[],"sourceFile":"pages/2026718 加班时间.md","siblingIds":["2026-07-18-longing-for-the-rain","2026-07-18-chainhaha","2026-07-18-凤头海雀的奇妙表情"],"backlinkIds":[],"relatedIds":[]},{"id":"2026-07-18-longing-for-the-rain","title":"Longing for the rain","date":"2026-07-18","hasValidDate":true,"contentHtml":"<p><button type=\"button\" class=\"ec-music-play\" data-track-index=\"0\"></button></p>\n","contentRaw":"<iframe frameborder=\"no\" border=\"0\" marginwidth=\"0\" marginheight=\"0\" width=330 height=86 src=\"//music.163.com/outchain/player?type=2&id=28474869&auto=1&height=66\"></iframe>","tags":[],"links":[],"media":[],"tracks":[{"platform":"netease","id":"28474869","title":"Longing for the rain","embedUrl":"https://music.163.com/outchain/player?type=2&id=28474869&auto=1&height=66","audioUrl":"https://music.163.com/song/media/outer/url?id=28474869.mp3","artist":"The Cambodian Space Project","coverUrl":"https://p1.music.126.net/GPBpZZLCYe_s4NoSlil0lw==/5918671092785863.jpg","durationMs":276000}],"sourceFile":"pages/Longing for the rain.md","siblingIds":["2026-07-18-2026718-加班时间","2026-07-18-chainhaha","2026-07-18-凤头海雀的奇妙表情"],"backlinkIds":[],"relatedIds":[]},{"id":"2026-07-18-chainhaha","title":"chainhaha","date":"2026-07-18","hasValidDate":true,"contentHtml":"<p>因为加班，所以晚上想去livehouse除除班味。在为数不多的没有售罄的演出中，看到了chainhaha。我一开始并没有决定好要不要去，直到我听了她的《圣火》，开头两个“娒”，让我意识到这个音乐人的歌中有温州的色彩。于是在前往公司的地铁上我购买了她今晚的演出。</p>\n<img class=\"ec-img\" src=\"../assets/thumbnails/2026-07-18-22-23-02.webp\" data-preview=\"../assets/previews/2026-07-18-22-23-02.webp\" alt=\"2026-07-18-22-23-02.jpeg\" loading=\"lazy\">\n\n<p>可能是我看过的live偏少，第一次见到在台下观众围绕中演出，配上她歌曲中祭祀感，沉浸感十足。只是在圈外的观众实在难以看到演出者，未免有些气馁。好在第一首歌结束后她便回到了舞台。</p>\n<img class=\"ec-img\" src=\"../assets/thumbnails/2026-07-18-22-23-30.webp\" data-preview=\"../assets/previews/2026-07-18-22-23-30.webp\" alt=\"2026-07-18-22-23-30.jpeg\" loading=\"lazy\">\n\n<p>不得不说，她的舞台设计着实不错，用有限的设备通过镜子和灯光展现出梦幻神秘的氛围，她的服装也是圣洁又异质，会让我联想到《丝之歌》里的角色。</p>\n<img class=\"ec-img\" src=\"../assets/thumbnails/2026-07-18-22-23-42.webp\" data-preview=\"../assets/previews/2026-07-18-22-23-42.webp\" alt=\"2026-07-18-22-23-42.jpeg\" loading=\"lazy\">\n\n<p>她的音乐我认为还是挺不错的，其中几首也有爵士的味道在里头，比较戳中我。不过让我惊讶的还是这位30.7岁的女士依旧给人一种纯真的感觉，与她的美学风格形成极大的反差，就像是那种会很兴奋分享自己感受的孩子。</p>\n<img class=\"ec-img\" src=\"../assets/thumbnails/2026-07-18-22-23-50.webp\" data-preview=\"../assets/previews/2026-07-18-22-23-50.webp\" alt=\"2026-07-18-22-23-50.jpeg\" loading=\"lazy\">\n\n<p>在演出接近尾声时，我忽然涌起一种悲伤的感觉。不知为何，主唱和她的演出让我体会到一个人要经历数不清的苦痛才能成为现在的自己，回首望去尽是伤痕累累，但最终依旧成为闪耀的自身。</p>\n","contentRaw":"因为加班，所以晚上想去livehouse除除班味。在为数不多的没有售罄的演出中，看到了chainhaha。我一开始并没有决定好要不要去，直到我听了她的《圣火》，开头两个“娒”，让我意识到这个音乐人的歌中有温州的色彩。于是在前往公司的地铁上我购买了她今晚的演出。\n\n![2026-07-18-22-23-02.jpeg](../assets/2026-07-18-22-23-02.jpeg)\n\n可能是我看过的live偏少，第一次见到在台下观众围绕中演出，配上她歌曲中祭祀感，沉浸感十足。只是在圈外的观众实在难以看到演出者，未免有些气馁。好在第一首歌结束后她便回到了舞台。\n\n![2026-07-18-22-23-30.jpeg](../assets/2026-07-18-22-23-30.jpeg)\n\n不得不说，她的舞台设计着实不错，用有限的设备通过镜子和灯光展现出梦幻神秘的氛围，她的服装也是圣洁又异质，会让我联想到《丝之歌》里的角色。\n\n![2026-07-18-22-23-42.jpeg](../assets/2026-07-18-22-23-42.jpeg)\n\n她的音乐我认为还是挺不错的，其中几首也有爵士的味道在里头，比较戳中我。不过让我惊讶的还是这位30.7岁的女士依旧给人一种纯真的感觉，与她的美学风格形成极大的反差，就像是那种会很兴奋分享自己感受的孩子。\n\n![2026-07-18-22-23-50.jpeg](../assets/2026-07-18-22-23-50.jpeg)\n\n在演出接近尾声时，我忽然涌起一种悲伤的感觉。不知为何，主唱和她的演出让我体会到一个人要经历数不清的苦痛才能成为现在的自己，回首望去尽是伤痕累累，但最终依旧成为闪耀的自身。","tags":[],"links":[],"media":[{"originalPath":"/home/runner/work/event-cloud/event-cloud/graph/assets/2026-07-18-22-23-02.jpeg","type":"image","alt":"2026-07-18-22-23-02.jpeg","thumbnailPath":"assets/thumbnails/2026-07-18-22-23-02.webp","previewPath":"assets/previews/2026-07-18-22-23-02.webp"},{"originalPath":"/home/runner/work/event-cloud/event-cloud/graph/assets/2026-07-18-22-23-30.jpeg","type":"image","alt":"2026-07-18-22-23-30.jpeg","thumbnailPath":"assets/thumbnails/2026-07-18-22-23-30.webp","previewPath":"assets/previews/2026-07-18-22-23-30.webp"},{"originalPath":"/home/runner/work/event-cloud/event-cloud/graph/assets/2026-07-18-22-23-42.jpeg","type":"image","alt":"2026-07-18-22-23-42.jpeg","thumbnailPath":"assets/thumbnails/2026-07-18-22-23-42.webp","previewPath":"assets/previews/2026-07-18-22-23-42.webp"},{"originalPath":"/home/runner/work/event-cloud/event-cloud/graph/assets/2026-07-18-22-23-50.jpeg","type":"image","alt":"2026-07-18-22-23-50.jpeg","thumbnailPath":"assets/thumbnails/2026-07-18-22-23-50.webp","previewPath":"assets/previews/2026-07-18-22-23-50.webp"}],"tracks":[],"sourceFile":"pages/chainhaha.md","siblingIds":["2026-07-18-2026718-加班时间","2026-07-18-longing- ssets/previews/2026-07-18-19-10-43.webp"},{"originalPath":"/home/runner/work/event-cloud/event-cloud/graph/assets/2026-07-18-19-10-49.jpeg","type":"image","alt":"2026-07-18-19-10-49.jpeg","thumbnailPath":"assets/thumbnails/2026-07-18-19-10-49.webp","previewPath":"assets/previews/2026-07-18-19-10-49.webp"}],"tracks":[],"sourceFile":"pages/凤头海雀的奇妙表情.md","siblingIds":["2026-07-18-2026718-加班时间","2026-07-18-longing-for-the-rain","2026-07-18-chainhaha"],"backlinkIds":[],"relatedIds":[]},{"id":"2018-10-01-初至深圳市民中心","title":"初至深圳市民中心","date":"2018-10-01","hasValidDate":true,"contentHtml":"<p>2018的深圳市民中心与往后的7年没有太大的区别，唯一变化的还是我自己。<br>当时我刚来到深圳，这个城市和我将面对的生活对我来说都很新鲜。我在莲花山公园偶遇了为庆祝国庆而表演的人们；参观了往后几年再也没去过的深圳工业展览馆，见识到了很多在当时看来很有未来感的展品……而我最喜欢的，是站在巨大的市民中心下看着高高的穹顶，第一次体会到一种“巨构”的感觉，感受着大风从四面八方涌来，对未来的期待充盈我的内心。</p>\n<p><img class=\"ec-img\" src=\"../assets/thumbnails/2026-07-17-22-39-56.webp\" data-preview=\"../assets/previews/2026-07-17-22-39-56.webp\" alt=\"2026-07-17-22-39-56.jpeg\" loading=\"lazy\"> <img class=\"ec-img\" src=\"../assets/thumbnails/2026-07-17-22-41-57.webp\" data-preview=\"../assets/previews/2026-07-17-22-41-57.webp\" alt=\"2026-07-17-22-41-57.jpeg\" loading=\"lazy\"> <img class=\"ec-img\" src=\"../assets/thumbnails/2026-07-17-22-42-21.webp\" data-preview=\"../assets/previews/2026-07-17-22-42-21.webp\" alt=\"2026-07-17-22-42-21.jpeg\" loading=\"lazy\"> <img class=\"ec-img\" src=\"../assets/thumbnails/2026-07-17-22-42-48.webp\" data-preview=\"../assets/previews/2026-07-17-22-42-48.webp\" alt=\"2026-07-17-22-42-48.jpeg\" loading=\"lazy\"> <img class=\"ec-img\" src=\"../assets/thumbnails/2026-07-17-22-43-11.webp\" data-preview=\"../assets/previews/2026-07-17-22-43-11.webp\" alt=\"2026-07-17-22-43-11.jpeg\" loading=\"lazy\"> <img class=\"ec-img\" src=\"../assets/thumbnails/2026-07-17-22-43-34.webp\" data-preview=\"../assets/previews/2026-07-17-22-43-34.webp\" alt=\"2026-07-17-22-43-34.jpeg\" loading=\"lazy\"> <img class=\"ec-img\" src=\"../assets/thumbnails/2026-07-17-22-44-00.w tle":"埃迪卡拉纪的海岸","date":"2026-07-09","hasValidDate":true,"contentHtml":"<p>下午摸鱼，一边开会，一边向GPT有关地质年代的知识，进行一场赛博远古之旅。从最早的冥古宙炼狱一般的岩浆海，跨越几十亿年的时光，来到安静而又充满活力的埃迪卡拉级的海岸，终于感受到了一种度假的感觉。用GPT的话来讲就是“它既保留了远古地球的陌生感，又已经拥有丰富而独特的生命景观，是整个前寒武纪最值得旅游的目的地。”<br>埃迪卡拉生物们给人一种很松弛的感觉，与世无争地躺在海底，在食物充足的环境中躺平了几千万年。那时大家都很友好，没有内卷，也没有焦虑，所有人都有光明的未来。<br>我很想在这样的海岸边待上一下午，听着海浪拍打岩石，看着这些缓慢呼吸，静静生长的前辈们，什么也不想，和它们一样，纯粹地感受这个世界。<br>或许可以让某个角色拥有将他人传送到埃迪卡拉纪海岸地能力，逐渐同化成一株随波摇摆的查尼迪盘，放弃万恶之源的智慧，获得永恒的平静。</p>\n<img class=\"ec-img\" src=\"../assets/thumbnails/2026-07-17-22-02-47.webp\" data-preview=\"../assets/previews/2026-07-17-22-02-47.webp\" alt=\"2026-07-17-22-02-47.jpeg\" loading=\"lazy\">","contentRaw":"下午摸鱼，一边开会，一边向GPT有关地质年代的知识，进行一场赛博远古之旅。从最早的冥古宙炼狱一般的岩浆海，跨越几十亿年的时光，来到安静而又充满活力的埃迪卡拉级的海岸，终于感受到了一种度假的感觉。用GPT的话来讲就是“它既保留了远古地球的陌生感，又已经拥有丰富而独特的生命景观，是整个前寒武纪最值得旅游的目的地。”\n埃迪卡拉生物们给人一种很松弛的感觉，与世无争地躺在海底，在食物充足的环境中躺平了几千万年。那时大家都很友好，没有内卷，也没有焦虑，所有人都有光明的未来。\n我很想在这样的海岸边待上一下午，听着海浪拍打岩石，看着这些缓慢呼吸，静静生长的前辈们，什么也不想，和它们一样，纯粹地感受这个世界。\n或许可以让某个角色拥有将他人传送到埃迪卡拉纪海岸地能力，逐渐同化成一株随波摇摆的查尼迪盘，放弃万恶之源的智慧，获得永恒的平静。\n\n![2026-07-17-22-02-47.jpeg](../assets/2026-07-17-22-02-47.jpeg)","tags":[],"links":[],"media":[{"originalPath":"/home/runner/work/event-cloud/event-cloud/graph/assets/2026-07-17-22-02-47.jpeg","type":"image","alt":"2026-07-17-22-02-47.jpeg","thumbnailPath":"assets/thumbnails/2026-07-17-22-02-47.webp","previewPath":"assets/previews/2026-07-17-22-02-47.webp"}],"tracks":[],"sourceFile":"pages/埃迪卡拉纪的海岸.md","siblingIds":["2026-07-09-粉红色的晚霞"],"backlinkIds":[],"relatedIds":[]},{"id":"2026-07-15-夏日时光机与放纵宵夜","title":"夏日时光机与放纵宵夜","date":"2026-07-15","hasValidDate":true,"contentHtml":"<p>趁着奥乐齐还没关门赶紧下班去买了点物资，最后没忍住买了一盒13元的卤味。<br>回到家取出冰箱里上周五在沃尔玛买的奇妙气泡水，配着卤味坐在沙发上看上次没看完的《夏日时光机》。<br>虽然看过四叠半版本，但是依旧感觉原版也不错，燥热的夏天，莽撞的主角团，错乱的时间线……真是一出充满活力的科幻喜剧。</p>\n<img class=\"ec-img\" src=\"../assets/thumbnails/2026-07-16-18-57-29.webp\" data-preview=\"../assets/previews/2026-07-16-18-57-29.webp\" alt=\"2026-07-16-18-57-29.jpeg\" loading=\"lazy\">\n\n<img class=\"ec-img\" src=\"../assets/thumbnai 6-07-10-20260710-咖啡时间","2026-07-10-自公司骑行至威海渔村饭店"],"backlinkIds":[],"relatedIds":[]},{"id":"2026-07-13-波莱罗舞曲","title":"波莱罗舞曲","date":"2026-07-13","hasValidDate":true,"contentHtml":"<p>早上上班想着选一首古典乐欣赏一下，顺便摸鱼了解一下这个曲子的背景和特点。于是就选中了我网易云歌单里的第一首——《波莱罗舞曲》。</p>\n<p>这是一首耳熟能详的曲子（古典感觉都是耳熟能详）。我对旋律虽然印象深刻，但从没意识到这是一首从头到尾的渐强，更没想到一首曲子用不同的乐器去演奏一段重复的旋律。基于新的知识去细听，就发现这个曲子听起来趣味十足，持续不断且渐强的军鼓，从solo到合奏的各色乐器，让这个重复循环的旋律充满活力与乐趣。</p>\n<p><button type=\"button\" class=\"ec-music-play\" data-track-index=\"0\"></button></p>\n","contentRaw":"早上上班想着选一首古典乐欣赏一下，顺便摸鱼了解一下这个曲子的背景和特点。于是就选中了我网易云歌单里的第一首——《波莱罗舞曲》。\n\n这是一首耳熟能详的曲子（古典感觉都是耳熟能详）。我对旋律虽然印象深刻，但从没意识到这是一首从头到尾的渐强，更没想到一首曲子用不同的乐器去演奏一段重复的旋律。基于新的知识去细听，就发现这个曲子听起来趣味十足，持续不断且渐强的军鼓，从solo到合奏的各色乐器，让这个重复循环的旋律充满活力与乐趣。\n\n<iframe style=\"border-radius:12px\" src=\"https://open.spotify.com/embed/track/6YlLdymeZi8FTNe3WCNULA?utm_source=generator\" width=\"100%\" height=\"352\" frameBorder=\"0\" allowfullscreen=\"\" allow=\"autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture\" loading=\"lazy\"></iframe>","tags":[],"links":[],"media":[],"tracks":[{"platform":"spotify","id":"6YlLdymeZi8FTNe3WCNULA","title":"Boléro, M. 81","embedUrl":"https://open.spotify.com/embed/track/6YlLdymeZi8FTNe3WCNULA?utm_source=generator","coverUrl":"https://image-cdn-fa.spotifycdn.com/image/ab67616d00001e02e2b685c0b1adc77eab9b1f24","artist":"Maurice Ravel / Leonard Bernstein / New York Philharmonic","durationMs":859373}],"sourceFile":"pages/波莱罗舞曲.md","siblingIds":["2026-07-13-20260713-咖啡时间","2026-07-13-栏杆上的奇妙贴纸"],"backlinkIds":[],"relatedIds":[]},{"id":"2026-07-20-爆甲的腾讯大楼","title":"爆甲的腾讯大楼","date":"2026-07-20","hasValidDate":true,"contentHtml":"<p>腾讯大楼的呼吸灯亮起来的时候，感觉像是披着古代铠甲的将军，灯光越发明亮，越像是要爆甲提高战斗力。</p>\n<img class=\"ec-img\" src=\"../assets/thumbnails/2026-07-23-10-29-53.webp\" data-preview=\"../assets/previews/2026-07-23-10-29-53.webp\" alt=\"2026-07-23-10-29-53.jpeg\" loading=\"lazy\">","contentRaw":"腾讯大楼的呼吸灯亮起来的时候，感觉像是披着古代铠甲的将军，灯光越发明亮，越像是要爆甲提高战斗力。\n\n![2026-07-23-10-29-53.jp mage","alt":"2026-07-23-10-24-03.jpeg","thumbnailPath":"assets/thumbnails/2026-07-23-10-24-03.webp","previewPath":"assets/previews/2026-07-23-10-24-03.webp"},{"originalPath":"/home/runner/work/event-cloud/event-cloud/graph/assets/2026-07-23-10-24-10.jpeg","type":"image","alt":"2026-07-23-10-24-10.jpeg","thumbnailPath":"assets/thumbnails/2026-07-23-10-24-10.webp","previewPath":"assets/previews/2026-07-23-10-24-10.webp"}],"tracks":[],"sourceFile":"pages/装死的皮蠹.md","siblingIds":["2026-07-23-20260723-午餐","2026-07-23-晚饭时间的天空","2026-07-23-盛夏枯萎的玫瑰"],"backlinkIds":[],"relatedIds":[]},{"id":"2026-07-17-西岸露天电影节之-汪汪梦里人","title":"西岸露天电影节之《汪汪梦里人》","date":"2026-07-17","hasValidDate":true,"contentHtml":"<p><button type=\"button\" class=\"ec-music-play\" data-track-index=\"0\"></button></p>\n<img class=\"ec-img\" src=\"../assets/thumbnails/2026-07-17-18-58-35.webp\" data-preview=\"../assets/previews/2026-07-17-18-58-35.webp\" alt=\"2026-07-17-18-58-35.jpeg\" loading=\"lazy\">\n\n<p>上海真的是一座爵士氛围很好的城市，每次电影放映前的表演都是爵士偏多。下午还刷到凤巢新开的食集也有一场爵士路演。<br>这次我只能坐在场外欣赏，在高温中听这场爵士演出。今这最后的《September》还是爵士改编版，有一段非常不错的即兴solo。<br>今天的云确实好看，但天气实在是太热，汗水止不住得流淌，没有夜风驱散暑气。音乐会结束的时候身后有一弯新月高悬，在蓝调时刻的天空中格外柔和。<br>电影依旧在七点半开始放映，我决心在小狗与机器人第一次跳舞时离开，逃离这高温，回到寒冷的工位去。</p>\n<img class=\"ec-img\" src=\"../assets/thumbnails/2026-07-17-18-59-01.webp\" data-preview=\"../assets/previews/2026-07-17-18-59-01.webp\" alt=\"2026-07-17-18-59-01.jpeg\" loading=\"lazy\">\n<img class=\"ec-img\" src=\"../assets/thumbnails/2026-07-17-18-59-14.webp\" data-preview=\"../assets/previews/2026-07-17-18-59-14.webp\" alt=\"2026-07-17-18-59-14.jpeg\" loading=\"lazy\"> <img class=\"ec-img\" src=\"../assets/thumbnails/2026-07-17-18-59-24.webp\" data-preview=\"../assets/previews/2026-07-17-18-59-24.webp\" alt=\"2026-07-17-18-59-24.jpeg\" loading=\"lazy\"> <img class=\"ec-img\" src=\"../assets/thumbnails/2026-07-17-18-59-40.webp\" data-preview=\"../assets/previews/2026-07-17-18-59-40.webp\" alt=\"两只沉思的夜师傅\" loading=\"lazy\">\n\n<img class=\"ec-img\" src=\".
