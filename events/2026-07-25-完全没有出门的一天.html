<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

<body>

  <div class="event-page" data-event-id="2026-07-25-完全没有出门的一天">
    <header class="event-header">
      <div class="event-date">2026-07-25</div>
      <h1 class="event-title">完全没有出门的一天 — Event Cloud</h1>
    </header>
    
    <article class="event-content">
      <p>上海的七月无比炎热，我没有勇气也没有欲望踏出家门，走入无尽热浪之中。站在空调房里看窗外炽热的阳光炙烤着大地，喧嚣的蝉鸣永不停歇，就感觉要被烤干。</p>
<p>正好今天oncall，自愿加了一会班，远程搞完没发出来的版本和拖欠的需求。昨天晚上由于系统维护发不了版本，我十点多就昏睡过去，定下的凌晨0点半的闹钟也没能叫醒我，醒来已经是六点半，睡眠质量倒也不错。</p>
<img class="ec-img" src="../assets/thumbnails/2026-07-25-23-29-50.webp" data-preview="../assets/previews/2026-07-25-23-29-50.webp" alt="2026-07-25-23-29-50.jpeg" loading="lazy">
    </article>
    
    
    
    
    
    
  </div>
  
  <script src="../js/app.js"></script>
  <script>
    (function () {
      // Lightbox for inline images (ec-img class)
      var overlay = document.createElement('div');
      overlay.id = 'ec-lightbox';
      overlay.style.cssText = 'display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9999;cursor:zoom-out;align-items:center;justify-content:center;';
      var lightboxImg = document.createElement('img');
      lightboxImg.style.cssText = 'max-width:92vw;max-height:92vh;border-radius:6px;box-shadow:0 4px 32px rgba(0,0,0,.6);';
      overlay.appendChild(lightboxImg);
      document.body.appendChild(overlay);

      function openLightbox(src) {
        lightboxImg.src = src;
        overlay.style.display = 'flex';
        document.body.style.overflow = 'hidden';
      }
      function closeLightbox() {
        overlay.style.display = 'none';
        document.body.style.overflow = '';
      }

      overlay.addEventListener('click', closeLightbox);
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeLightbox();
      });

      document.querySelectorAll('.ec-img').forEach(function(img) {
        img.style.cursor = 'zoom-in';
        img.addEventListener('click', function() {
          var preview = img.getAttribute('data-preview') || img.src;
          openLightbox(preview);
        });
      });
    })();
  </script>
</body>
</html>
