<body>

  <div class="event-page" data-event-id="2026-09-15-送母亲去高铁站">
    <header class="event-header">
      <div class="event-date">2026-09-15</div>
      <h1 class="event-title">送母亲去高铁站 — Event Cloud</h1>
    </header>
    
    <article class="event-content">
      <p>今天是母亲回老家的日子，考虑到上海虹桥站路线复杂，我中午公司吃完饭，就去地铁站和母亲汇合，送她进高铁站。<br>我原以为一个人久了就很难适应和他人一起生活，但现在才发现和他人一起生活久了，回到独身生活也确实会有空落落的感觉。</p>
<img class="ec-img" src="../assets/thumbnails/2026-09-18-11-00-06.webp" data-preview="../assets/previews/2026-09-18-11-00-06.webp" alt="2026-09-18-11-00-06.jpeg" loading="lazy">
    </article>
    
    
    
    
    
    
  </div>
  
  <script src="../js/app.js"></script>
  <script>
    (function () {
      // Lightbox for inline images (ec-img class)
      var overlay = document.createElement('div');
      overlay.id = 'ec-lightbox';
      overlay.style.cssText = 'display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9999;cursor:zoom-out;align-items:center;justify-content:center;';
      var lightboxImg = document.createElement('img');
      lightboxImg.style.cssText = 'max-width:92vw;max-height:92vh;border-radius:6px;box-shadow:0 4px 32px rgba(0,0,0,.6);';
      overlay.appendChild(lightboxImg);
      document.body.appendChild(overlay);

      function openLightbox(src) {
        lightboxImg.src = src;
        overlay.style.display = 'flex';
        document.body.style.overflow = 'hidden';
      }
      function closeLightbox() {
        overlay.style.display = 'none';
        document.body.style.overflow = '';
      }

      overlay.addEventListener('click', closeLightbox);
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeLightbox();
      });

      document.querySelectorAll('.ec-img').forEach(function(img) {
        img.style.cursor = 'zoom-in';
        img.addEventListener('click', function() {
          var preview = img.getAttribute('data-preview') || img.src;
          openLightbox(preview);
        });
      });
    })();
  </script>
</body>
</html>
