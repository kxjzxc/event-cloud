      <p>去健身房的路上开满了忘忧草，在橙黄的灯光下颇有生命力</p>
<img class="ec-img" src="../assets/thumbnails/2026-08-27-14-02-48.webp" data-preview="../assets/previews/2026-08-27-14-02-48.webp" alt="2026-08-27-14-02-48.jpeg" loading="lazy">

<p>中元节的前夕，月亮格外的亮，在浮云间穿梭，像是月出。</p>
<img class="ec-img" src="../assets/thumbnails/2026-08-27-14-02-56.webp" data-preview="../assets/previews/2026-08-27-14-02-56.webp" alt="2026-08-27-14-02-56.jpeg" loading="lazy">

<p>老家的车库里发现一条蛇，被水电工扔到了附近的山里。豆包查了一下是银环蛇，国内毒性最强的陆生毒蛇，俗称寸寸白，还是颇为吓人。</p>
<img class="ec-img" src="../assets/thumbnails/2026-08-27-14-03-11.webp" data-preview="../assets/previews/2026-08-27-14-03-11.webp" alt="2026-08-27-14-03-11.jpeg" loading="lazy">

  <script src="../js/app.js"></script>
  <script>
    (function () {
      // Lightbox for inline images (ec-img class)
      var overlay = document.createElement('div');
      overlay.id = 'ec-lightbox';
      overlay.style.cssText = 'display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9999;cursor:zoom-out;align-items:center;justify-content:center;';
      var lightboxImg = document.createElement('img');
      lightboxImg.style.cssText = 'max-width:92vw;max-height:92vh;border-radius:6px;box-shadow:0 4px 32px rgba(0,0,0,.6);';
      overlay.appendChild(lightboxImg);
      document.body.appendChild(overlay);

      function openLightbox(src) {
        lightboxImg.src = src;
        overlay.style.display = 'flex';
        document.body.style.overflow = 'hidden';
      }
      function closeLightbox() {
        overlay.style.display = 'none';
        document.body.style.overflow = '';
      }

      overlay.addEventListener('click', closeLightbox);
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeLightbox();
      });

      document.querySelectorAll('.ec-img').forEach(function(img) {
        img.style.cursor = 'zoom-in';
        img.addEventListener('click', function() {
          var preview = img.getAttribute('data-preview') || img.src;
          openLightbox(preview);
        });
      });
    })();
  </script>
