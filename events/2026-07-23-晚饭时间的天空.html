<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

</head>
<body>

  <div class="event-page" data-event-id="2026-07-23-晚饭时间的天空">
    <header class="event-header">
      <div class="event-date">2026-07-23</div>
      <h1 class="event-title">晚饭时间的天空 — Event Cloud</h1>
    </header>
    
    <article class="event-content">
      <p><img class="ec-img" src="../assets/thumbnails/2026-07-24-16-20-07.webp" data-preview="../assets/previews/2026-07-24-16-20-07.webp" alt="2026-07-24-16-20-07.jpeg" loading="lazy"> <img class="ec-img" src="../assets/thumbnails/2026-07-24-16-20-13.webp" data-preview="../assets/previews/2026-07-24-16-20-13.webp" alt="2026-07-24-16-20-13.jpeg" loading="lazy"></p>
<p>吃完赛百味出来，看见天边一个亮点，星星不应该独自在这个时间点的天空上出现，所以我猜这是大型飞行器，何尝不是一种人造星星呢？</p>
<img class="ec-img" src="../assets/thumbnails/2026-07-24-16-20-30.webp" data-preview="../assets/previews/2026-07-24-16-20-30.webp" alt="2026-07-24-16-20-30.jpeg" loading="lazy">
    </article>
    
    
    
    
    
    
  </div>
  
  <script src="../js/app.js"></script>
  <script>
    (function () {
      // Lightbox for inline images (ec-img class)
      var overlay = document.createElement('div');
      overlay.id = 'ec-lightbox';
      overlay.style.cssText = 'display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9999;cursor:zoom-out;align-items:center;justify-content:center;';
      var lightboxImg = document.createElement('img');
      lightboxImg.style.cssText = 'max-width:92vw;max-height:92vh;border-radius:6px;box-shadow:0 4px 32px rgba(0,0,0,.6);';
      overlay.appendChild(lightboxImg);
      document.body.appendChild(overlay);

      function openLightbox(src) {
        lightboxImg.src = src;
        overlay.style.display = 'flex';
        document.body.style.overflow = 'hidden';
      }
      function closeLightbox() {
        overlay.style.display = 'none';
        document.body.style.overflow = '';
      }

      overlay.addEventListener('click', closeLightbox);
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeLightbox();
      });

      document.querySelectorAll('.ec-img').forEach(function(img) {
        img.style.cursor = 'zoom-in';
        img.addEventListener('click', function() {
          var preview = img.getAttribute('data-preview') || img.src;
          openLightbox(preview);
        });
      });
    })();
  </script>
</body>
</html>
