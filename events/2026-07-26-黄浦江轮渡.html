<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

</head>
<body>

  <div class="event-page" data-event-id="2026-07-26-黄浦江轮渡">
    <header class="event-header">
      <div class="event-date">2026-07-26</div>
      <h1 class="event-title">黄浦江轮渡 — Event Cloud</h1>
    </header>
    
    <article class="event-content">
      <p>第一次坐黄浦江的两元轮渡，在炎热的夏夜还是有些受罪，人多到也没法到窗边看江景。</p>
<p><img class="ec-img" src="../assets/thumbnails/2026-07-27-09-41-01.webp" data-preview="../assets/previews/2026-07-27-09-41-01.webp" alt="2026-07-27-09-41-01.jpeg" loading="lazy"> <img class="ec-img" src="../assets/thumbnails/2026-07-27-09-41-08.webp" data-preview="../assets/previews/2026-07-27-09-41-08.webp" alt="2026-07-27-09-41-08.jpeg" loading="lazy"></p>
<img class="ec-img" src="../assets/thumbnails/2026-07-27-12-27-27.webp" data-preview="../assets/previews/2026-07-27-12-27-27.webp" alt="2026-07-27-12-27-27.jpeg" loading="lazy">
    </article>
    
    
    
    
    
    
  </div>
  
  <script src="../js/app.js"></script>
  <script>
    (function () {
      // Lightbox for inline images (ec-img class)
      var overlay = document.createElement('div');
      overlay.id = 'ec-lightbox';
      overlay.style.cssText = 'display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9999;cursor:zoom-out;align-items:center;justify-content:center;';
      var lightboxImg = document.createElement('img');
      lightboxImg.style.cssText = 'max-width:92vw;max-height:92vh;border-radius:6px;box-shadow:0 4px 32px rgba(0,0,0,.6);';
      overlay.appendChild(lightboxImg);
      document.body.appendChild(overlay);

      function openLightbox(src) {
        lightboxImg.src = src;
        overlay.style.display = 'flex';
        document.body.style.overflow = 'hidden';
      }
      function closeLightbox() {
        overlay.style.display = 'none';
        document.body.style.overflow = '';
      }

      overlay.addEventListener('click', closeLightbox);
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeLightbox();
      });

      document.querySelectorAll('.ec-img').forEach(function(img) {
        img.style.cursor = 'zoom-in';
        img.addEventListener('click', function() {
          var preview = img.getAttribute('data-preview') || img.src;
          openLightbox(preview);
        });
      });
    })();
  </script>
</body>
</html>
